name: Publish 0.2.7 Repair

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Basarili 0.2.7 paketlerini indir
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32061999368
          path: release-files
          merge-multiple: true

      - name: Public Release'i yayinla
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: desktop-v0.2.7
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" --draft \
            --title 'SiteStudyo Sales OS 0.2.7' \
            --notes $'Kurulum dosyasini isletim sisteminize gore indirin.\n\n- Windows: `.exe` (onerilen) veya `.msi`\n- macOS: `.dmg`\n- Linux: `.AppImage` veya `.deb`\n\nIlk acilista sunucu adresi olarak `https://api.sitestudyo.com` girin.'

          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.msi|*.dmg|*.AppImage|*.deb)
                gh release upload "$TAG" "$file" --clobber
                ;;
            esac
          done < <(find release-files -type f -print0)

          gh release edit "$TAG" --draft=false --latest
