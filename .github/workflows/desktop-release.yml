# Masaustu installer'lari BURADA uretilir, VDS'te degil.
#
# Neden: .msi yalnizca Windows'ta uretilebilir; VDS Linux ve uzerinde Rust
# yok. Her isletim sistemi kendi runner'inda kendi installer'ini derler.
# Kullanicinin bilgisayarinda Node veya Rust kurulu olmasi gerekmez —
# tek dosya indirip kurar.
#
# Yayinlamak icin:
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
#
# Elle calistirmak icin: Actions sekmesi -> Desktop Release -> Run workflow

name: Desktop Release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

# tauri-action surum olusturup dosya yukleyecek; yazma izni sart.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: .msi ve .exe (NSIS) ureten tek platform.
          - os: windows-latest
            args: ''
          # macOS: Intel ve Apple Silicon tek pakette.
          - os: macos-latest
            args: '--target universal-apple-darwin'
          # Linux: .AppImage ve .deb
          - os: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Tauri'nin Linux'ta ihtiyac duydugu sistem kutuphaneleri.
      # Diger platformlarda gerekmiyor.
      - name: Linux bagimliliklari
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential curl wget file \
            libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS'ta tek pakette iki mimari icin ikisi de gerekli.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Rust derlemesi uzun surer; onbellek olmadan her calisma ~10 dk.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop-client/src-tauri -> target'

      - name: Bagimliliklari kur
        working-directory: desktop-client
        run: npm ci --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-client
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-vdev' }}
          releaseName: 'SiteStudyo Sales OS ${{ github.ref_type == ''tag'' && github.ref_name || ''(deneme)'' }}'
          releaseBody: |
            Kurulum dosyasini indirip calistirin.

            | Isletim sistemi | Dosya |
            |---|---|
            | Windows | `.msi` (veya `.exe`) |
            | macOS | `.dmg` |
            | Linux | `.AppImage` / `.deb` |

            **Ilk acilista sunucu adresi sorulur:**
            `https://api.sitestudyo.com`

            Adresi girip "Baglantiyi test et" dedikten sonra hesabinizla
            giris yapin. Adres bu bilgisayara kaydedilir, bir daha sorulmaz.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Paketleri artifact olarak da birak.
      #
      # NEDEN: imza artik burada atilmiyor. Sirri GitHub'a dogru bicimde
      # yazmak uc denemede de basarisiz oldu (340, 344 karakter geldi; 348
      # olmasi gerekiyor) ve her deneme sekiz dakikalik derlemeyi yakti.
      # Imza anahtari zaten sunucuda duruyor, imzalamak icin CI'a ihtiyac
      # yok. Sunucu bu artifact'i indirip imzaliyor ve latest.json'i kendi
      # uretiyor. Boylece kopyala-yapistir zincirinden tamamen cikildi.
      - name: Paketleri artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: paketler-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            desktop-client/src-tauri/target/release/bundle/**/*.AppImage
            desktop-client/src-tauri/target/release/bundle/**/*.deb
            desktop-client/src-tauri/target/release/bundle/**/*.msi
            desktop-client/src-tauri/target/release/bundle/**/*-setup.exe
            desktop-client/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            desktop-client/src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
