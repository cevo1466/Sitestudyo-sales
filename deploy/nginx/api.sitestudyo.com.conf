# SiteStudyo Sales OS — API vhost'u
#
# KURULUM
#   sudo cp deploy/nginx/api.sitestudyo.com.conf /var/www/nginx-vhosts/
#   sudo mkdir -p /var/www/_acme/api.sitestudyo.com
#   sudo docker exec hosting_nginx nginx -t     # once dogrula
#   sudo docker exec hosting_nginx nginx -s reload
#
# Sertifika alinana kadar asagidaki 443 blogunu yorumda birak, yoksa
# nginx eksik sertifika dosyasi yuzunden HIC baslamaz ve sunucudaki
# butun siteler duser. Once 80 blogu -> certbot -> sonra 443.
# Ayrintili adimlar: deploy/certbot-webroot.md

server {
    listen 80;
    listen [::]:80;
    server_name api.sitestudyo.com;

    # Let's Encrypt HTTP-01 dogrulamasi
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_acme/api.sitestudyo.com;
        try_files $uri =404;
    }

    location / { return 301 https://api.sitestudyo.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sitestudyo.com;

    ssl_certificate     /etc/letsencrypt/live/api.sitestudyo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sitestudyo.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.sitestudyo.com/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/api.sitestudyo.com.access.log;
    error_log  /var/log/nginx/api.sitestudyo.com.error.log;

    # Masaustu istemcisi tek istekte binlerce isletme gonderebilir (toplu islem)
    client_max_body_size 8M;

    # --- Cloudflare gercek ziyaretci IP'si ---
    # Kayit su an "DNS only"; ilerde proxy acilirsa bu blok olmadan
    # $remote_addr CF edge'i olur ve oran sinirlama tek sayaca duser.
    # Origin'e dogrudan baglanan biri CF-Connecting-IP uyduramaz: kaynak
    # adresi asagidaki araliklarin disindadir. Liste: cloudflare.com/ips
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # --- Canli akis (is durumu / analiz ilerlemesi) ---
    # Ayri blok cunku WebSocket ve SSE tamponlanirsa ilerleme cubugu
    # is bitene kadar hic kimildamaz.
    location /api/v1/ws {
        proxy_pass http://salesos_backend:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        # DIKKAT: host adi `salesos_backend` — konteyner adi.
        # Docker'in gomulu DNS'i cozer; ayni agda oldugumuz icin calisir
        # (docker-compose.yml'deki `hosting` external network).
        proxy_pass http://salesos_backend:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Isletme kesfi ve site analizi uzun surer
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
