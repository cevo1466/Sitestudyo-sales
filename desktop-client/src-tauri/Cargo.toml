[package]
name = "sitestudyo-sales-os"
version = "0.2.1"
description = "SiteStudyo Sales OS"
authors = ["SiteStudyo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sitestudyo_sales_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# NOT: tauri-plugin-store KULLANILMIYOR. Sunucu adresi localStorage'da
# tutuluyor ve Tauri'nin webview'unde localStorage zaten kalici (uygulamanin
# kendi profilinde). Ayri bir eklenti, derlemede kirilabilecek fazladan bir
# parca olurdu — kazanci yok.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"   # boyut oncelikli: installer ne kadar kucukse indirmesi o kadar kolay
panic = "abort"
strip = true
